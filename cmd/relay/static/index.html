<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="title_index">Drop · encrypted file transfer, peer-to-peer</title>
<meta name="description" content="Send a file to anyone, peer-to-peer through your browser. Encrypted. Self-hostable.">
<meta property="og:title" content="Drop">
<meta property="og:description" content="Send a file to anyone, peer-to-peer through your browser. Encrypted. Self-hostable.">
<meta property="og:url" content="https://drop.volt-logik.io">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=20260510a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/static/style.css?v=20260511b">
<link rel="stylesheet" href="/static/style-light.css?v=20260516a">
<script>(function(){var t=localStorage.getItem('drop-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light')})();</script>
<script src="/static/config.js"></script>
<script src="/static/i18n.js?v=20260516b"></script>
</head>
<body class="landing-body">

<header class="top-strip">
  <div class="strip-cell brand"><a href="/">DROP</a></div>
  <div class="strip-cell spacer"></div>
  <div class="strip-cell status live"><span class="dot"></span><span data-i18n="relay_online">RELAY ONLINE</span></div>
  <button id="theme-toggle" class="strip-cell theme-toggle" aria-label="Toggle light/dark theme">◑ LIGHT</button>
  <a href="https://github.com/whaeuser/Airpipe" target="_blank" rel="noopener" class="strip-cell port-btn">GITHUB <span class="arrow">↗</span></a>
</header>

<main class="hero-clean">
  <div class="hero-text">
    <h1 class="hero-mark">DROP</h1>
    <p class="hero-line" data-i18n="hero_line">Send a file to anyone, peer-to-peer through your browser. Encrypted. Self-hostable.</p>

    <div class="hero-cta">
      <a href="/live" class="cta cta-primary"><span data-i18n="cta_send">Send a file</span> <span class="arrow">→</span></a>
      <a href="/send" class="cta-link" data-i18n="cta_mailbox">or upload to a 10-min mailbox</a>
    </div>

    <div class="hero-receive">
      <label for="phrase-input" data-i18n="phrase_label">Got a passphrase?</label>
      <div class="hero-phrase">
        <input type="text" id="phrase-input" class="phrase-input" placeholder="RIVER FALCON MARBLE 42" autocomplete="off" spellcheck="false">
        <button class="phrase-go" onclick="submitPhrase()">↵</button>
      </div>
      <div id="phrase-error" class="phrase-error"></div>
    </div>
  </div>

  <div class="hero-diagram">
    <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Two devices connected directly. The relay sits above and only sees encrypted signaling.">
      <defs>
        <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3"/>
        </filter>
      </defs>

      <!-- relay node, small, top-center -->
      <g class="d-relay">
        <rect x="430" y="40" width="140" height="62" rx="10" fill="#221d19" stroke="#5A534A" stroke-width="1.2"/>
        <circle cx="448" cy="58" r="2" fill="#FF4F00" opacity="0.85"/>
        <circle cx="458" cy="58" r="2" fill="#5A534A"/>
        <circle cx="468" cy="58" r="2" fill="#5A534A"/>
        <line x1="448" y1="74" x2="552" y2="74" stroke="#5A534A" stroke-width="1" opacity="0.5"/>
        <line x1="448" y1="84" x2="540" y2="84" stroke="#5A534A" stroke-width="1" opacity="0.5"/>
        <text x="500" y="125" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#847C71" letter-spacing="3">RELAY</text>
      </g>

      <!-- signaling lines (dotted, from device tops curving up to relay corners) -->
      <path d="M 260 200 Q 320 130 430 90" fill="none" stroke="#ECE6DC" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>
      <path d="M 740 200 Q 680 130 570 90" fill="none" stroke="#ECE6DC" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4"/>

      <!-- subtle "encrypted signaling" label above direct line -->
      <text x="500" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#5A534A" letter-spacing="2" data-i18n="svg_signaling">encrypted signaling</text>

      <!-- left device card (sender) -->
      <g class="d-device">
        <rect x="80" y="180" width="180" height="110" rx="12" fill="#1B1714" stroke="#ECE6DC" stroke-width="1.4" opacity="0.95"/>
        <rect x="80" y="180" width="180" height="22" rx="12" fill="#221d19" stroke="none"/>
        <rect x="80" y="194" width="180" height="8" fill="#221d19" stroke="none"/>
        <circle cx="94" cy="191" r="2.4" fill="#5A534A"/>
        <circle cx="103" cy="191" r="2.4" fill="#5A534A"/>
        <circle cx="112" cy="191" r="2.4" fill="#5A534A"/>
        <!-- file icon centered -->
        <rect x="155" y="225" width="32" height="38" rx="2" fill="none" stroke="#ECE6DC" stroke-width="1.2"/>
        <line x1="160" y1="237" x2="180" y2="237" stroke="#5A534A" stroke-width="1"/>
        <line x1="160" y1="244" x2="178" y2="244" stroke="#5A534A" stroke-width="1"/>
        <line x1="160" y1="251" x2="175" y2="251" stroke="#5A534A" stroke-width="1"/>
        <text x="170" y="305" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#ECE6DC" letter-spacing="3">SENDER</text>
      </g>

      <!-- right device card (receiver) -->
      <g class="d-device">
        <rect x="740" y="180" width="180" height="110" rx="12" fill="#1B1714" stroke="#ECE6DC" stroke-width="1.4" opacity="0.95"/>
        <rect x="740" y="180" width="180" height="22" rx="12" fill="#221d19" stroke="none"/>
        <rect x="740" y="194" width="180" height="8" fill="#221d19" stroke="none"/>
        <circle cx="754" cy="191" r="2.4" fill="#5A534A"/>
        <circle cx="763" cy="191" r="2.4" fill="#5A534A"/>
        <circle cx="772" cy="191" r="2.4" fill="#5A534A"/>
        <!-- received file (orange, just arrived) -->
        <rect x="815" y="225" width="32" height="38" rx="2" fill="none" stroke="#FF4F00" stroke-width="1.4"/>
        <line x1="820" y1="237" x2="840" y2="237" stroke="#FF4F00" stroke-width="1" opacity="0.7"/>
        <line x1="820" y1="244" x2="838" y2="244" stroke="#FF4F00" stroke-width="1" opacity="0.7"/>
        <line x1="820" y1="251" x2="835" y2="251" stroke="#FF4F00" stroke-width="1" opacity="0.7"/>
        <text x="830" y="305" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#ECE6DC" letter-spacing="3">RECEIVER</text>
      </g>

      <!-- direct line: solid orange between devices -->
      <line x1="260" y1="240" x2="740" y2="240" stroke="#FF4F00" stroke-width="2.4"/>

      <!-- single moving dot along the direct line, slow -->
      <circle cx="260" cy="240" r="6" fill="#FF4F00" filter="url(#softglow)">
        <animate attributeName="cx" values="260;740;260" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- label below direct line -->
      <text x="500" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#ECE6DC" font-weight="500" data-i18n="svg_direct">your bytes go direct</text>
    </svg>
    <p class="how-line" data-i18n="how_line">The relay only ever sees encrypted signaling, never your file.</p>
  </div>
</main>

<footer class="bottom-strip">
  <span class="strip-cell" data-i18n="footer_enc">End-to-end encrypted</span>
  <span class="spacer"></span>
  <span class="strip-cell"><a href="https://github.com/whaeuser/Airpipe" target="_blank" rel="noopener">Source</a></span>
</footer>

<script>
function $(id){return document.getElementById(id)}
function normalize(p){return p.toUpperCase().trim().replace(/\s+/g,' ')}
async function sha256(s){
  const data=new TextEncoder().encode(s);
  const hash=await crypto.subtle.digest('SHA-256',data);
  return new Uint8Array(hash);
}
function hexEncode(bytes){return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('')}
function b64urlEncode(bytes){
  let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function submitPhrase(){
  const errEl=$('phrase-error');errEl.textContent='';
  const phrase=normalize($('phrase-input').value);
  if(!phrase||phrase.length<5){errEl.textContent=t('js_phrase_err');return}
  const t=await sha256('drop:token:'+phrase);
  const k=await sha256('drop:key:'+phrase);
  location.href='/d/'+hexEncode(t.slice(0,8))+'#'+b64urlEncode(k);
}
$('phrase-input').addEventListener('keydown',(e)=>{if(e.key==='Enter')submitPhrase()});

(function(){
  var btn=$('theme-toggle');
  function upd(){var l=document.documentElement.getAttribute('data-theme')==='light';btn.textContent=l?t('theme_dark'):t('theme_light');}
  btn.addEventListener('click',function(){
    var l=document.documentElement.getAttribute('data-theme')==='light';
    if(l){document.documentElement.removeAttribute('data-theme');localStorage.setItem('drop-theme','dark');}
    else{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('drop-theme','light');}
    upd();
  });
  upd();
})();

function copyCode(el){
  const text=el.querySelector('code').textContent.trim();
  navigator.clipboard.writeText(text);
  const tag=el.querySelector('.copy-tag');
  if(tag){const orig=tag.textContent;tag.textContent='ok';setTimeout(()=>tag.textContent=orig,1100)}
}
</script>
</body>
</html>
