services:
  relay:
    build: .
    image: drop-relay:local
    container_name: drop-relay
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - DROP_ALLOWED_ORIGINS=https://drop.volt-logik.io,https://pipe.nurdaheim.net
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  relay-internal:
    build: .
    image: drop-relay:local
    container_name: drop-relay-internal
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      - DROP_ALLOWED_ORIGINS=https://drop.internal.volt-logik.io,https://volt-logik.io,https://*.volt-logik.io
      - DROP_MAX_UPLOAD_MB=2048
      - DROP_FILE_EXPIRY=60m
    labels:
      com.centurylinklabs.watchtower.enable: "false"
