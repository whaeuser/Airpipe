services:
  relay:
    build: .
    image: drop-relay:local
    container_name: drop-relay
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - DROP_ALLOWED_ORIGINS=https://pipe.nurdaheim.net,https://file.volt-logik.io
      - DROP_MAX_UPLOAD_MB=500
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN}
      - PUSHOVER_USER=${PUSHOVER_USER}
    labels:
      com.centurylinklabs.watchtower.enable: "false"

