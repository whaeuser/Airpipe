services:
  relay:
    build: .
    image: ghcr.io/sanyam-g/airpipe-relay:latest
    container_name: airpipe-relay
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - AIRPIPE_ALLOWED_ORIGINS=https://pipe.nurdaheim.net,https://file.volt-logik.io
      - AIRPIPE_MAX_UPLOAD_MB=500
    labels:
      com.centurylinklabs.watchtower.enable: "false"

